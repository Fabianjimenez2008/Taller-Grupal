{% extends "base.html" %}
{% block title %}Editar comida · {{ nombres_display[dia] }}{% endblock %}
{% block content %}
  <h2>Editar comida — {{ nombres_display[dia] }}</h2>
  <form class="form-comida" method="post">
    <input name="nombre" value="{{ comida.nombre }}" placeholder="Nombre" required>
    <select name="tipo" required>
      {% for t in tipos %}
        <option value="{{ t }}" {{ 'selected' if t == comida.tipo else '' }}>{{ nombres_display_tipo[t] }}</option>
      {% endfor %}
    </select>
    <button type="submit">Guardar cambios</button>
  </form>
  <p><a href="{{ url_for('comida.ver_comidas', nombre_dia=dia) }}">Cancelar</a></p>
{% endblock %}

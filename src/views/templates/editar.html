{% extends "base.html" %}
{% block title %}Editar ejercicio · {{ nombres_display[dia] }}{% endblock %}
{% block content %}
  <h2>Editar ejercicio — {{ nombres_display[dia] }}</h2>
  <form class="form-ejercicio" method="post">
    <input name="nombre" value="{{ ejercicio.nombre }}" placeholder="Nombre" required>
    <input name="series" type="number" min="1" value="{{ ejercicio.series }}" placeholder="Series" required>
    <input name="repeticiones" type="number" min="1" value="{{ ejercicio.repeticiones }}" placeholder="Repeticiones" required>
    <input name="peso" value="{{ ejercicio.peso or '' }}" placeholder="Peso (opcional)">
    <input name="descanso" value="{{ ejercicio.descanso or '' }}" placeholder="Descanso (opcional)">
    <textarea name="notas" placeholder="Notas (opcional)">{{ ejercicio.notas or '' }}</textarea>
    <button type="submit">Guardar cambios</button>
  </form>
  <p><a href="{{ url_for('rutina.ver_dia', nombre_dia=dia) }}">Cancelar</a></p>
{% endblock %}

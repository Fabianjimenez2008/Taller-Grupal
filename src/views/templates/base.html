<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rutinas de gimnasio{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.4;
    }
    h1 { font-size: 1.4rem; }
    nav { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    nav a {
      padding: .4rem .8rem;
      border: 1px solid #8884;
      border-radius: .5rem;
      text-decoration: none;
      color: inherit;
    }
    nav a.activo { background: #4f46e5; color: white; border-color: #4f46e5; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #8884; vertical-align: top; }
    form.inline { display: inline; }
    .acciones { display: flex; gap: .5rem; }
    form.form-ejercicio { display: grid; gap: .6rem; grid-template-columns: repeat(2, 1fr); margin-top: 1rem; }
    form.form-ejercicio input, form.form-ejercicio textarea {
      padding: .5rem;
      border: 1px solid #8884;
      border-radius: .4rem;
      font: inherit;
      background: transparent;
      color: inherit;
    }
    form.form-ejercicio textarea { grid-column: span 2; resize: vertical; }
    form.form-ejercicio button { grid-column: span 2; padding: .7rem; border: none; border-radius: .4rem; background: #4f46e5; color: white; font: inherit; cursor: pointer; }
    a.boton-editar { color: #4f46e5; text-decoration: none; }
    button.eliminar { background: #dc2626; color: white; border: none; border-radius: .3rem; padding: .3rem .6rem; cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <h1>🏋️ Rutinas de gimnasio</h1>
  <nav>
    {% for d in dias_nav %}
      <a href="{{ url_for('rutina.ver_dia', nombre_dia=d) }}"
         class="{{ 'activo' if (dia is defined and dia == d) else '' }}">
        {{ nombres_display[d] }}
      </a>
    {% endfor %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
